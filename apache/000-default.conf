ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /sftp/agencia/site

    <Directory /sftp/agencia/site>
        # Evita listagem de diretórios. Links só são seguidos quando o dono
        # do link e do destino coincide, sem quebrar mod_rewrite em .htaccess.
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted

        DirectoryIndex index.php index.html
    </Directory>

    # Respeita HTTPS quando houver reverse proxy/edge na frente.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
